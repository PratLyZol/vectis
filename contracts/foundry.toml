[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-v5.4.0/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "../web/src/config" },
  { access = "read-write", path = "../keeper" },
]

[fuzz]
runs = 512

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
